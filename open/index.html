<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Box — First Pull Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            background: #F7F9FB !important; 
            font-family: 'Inter', sans-serif !important;
            color: #0F172A;
        }
        
        nav {
            background: #FFFFFF;
            border-bottom: 1px solid #E4EAF0;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
        }
        
        nav .logo {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            color: #0F172A;
        }
        
        nav .logo .teal { color: #0F766E; }
        
        nav .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        nav a {
            text-decoration: none;
            color: #0F766E;
            font-weight: 600;
            font-size: 14px;
        }
        
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 80px 24px;
            text-align: center;
        }
        
        h1 {
            font-family: 'DM Sans', sans-serif;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 32px;
            color: #0F172A;
            letter-spacing: -0.02em;
        }
        
        .child-name {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: #475569;
            margin-bottom: 32px;
        }
        
        .pack-visual {
            width: 120px;
            height: 168px;
            border: 2px solid #0F766E;
            border-radius: 8px;
            margin: 0 auto 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F0FDFA;
        }
        
        .pack-text {
            font-family: 'DM Sans', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #0F766E;
        }
        
        .instruction {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        
        .btn-primary {
            background: #0F766E;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            height: 44px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background 0.2s;
        }
        
        .btn-primary:hover { background: #0D5F58; }
        
        footer {
            background: #FFFFFF;
            border-top: 1px solid #E4EAF0;
            padding: 32px 24px;
            text-align: center;
            color: #64748B;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin-top: 64px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html" class="logo">FIRST PULL <span class="teal">CARDS</span></a>
        <div class="nav-links">
            <a href="../explore/index.html">Card Explorer</a>
            <a href="../open/collection.html">My Collection</a>
            <a href="../login.html">Log In</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>Your box is here.</h1>
        
        <div class="child-name" id="childName"></div>
        
        <div class="pack-visual">
            <div class="pack-text">FPC</div>
        </div>
        
        <p class="instruction">Open your pack. For each card, type the player name below to find it.</p>
        
        <button class="btn-primary" onclick="startPacking()">Find My Cards</button>
    </div>
    
    <footer>
        2026 First Pull Cards. Pilot program.
    </footer>
    
    <script>
        // Update nav based on login state
        function updateNavState() {
            const isLoggedIn = sessionStorage.getItem('fpc_logged_in') === 'true';
            const navLinks = document.querySelector('.nav-links');
            if (navLinks) {
                if (isLoggedIn) {
                    navLinks.innerHTML = `
                        <a href="../dashboard/index.html">Dashboard</a>
                        <a href="../open/collection.html">My Collection</a>
                        <a href="#" onclick="logout(); return false;">Log Out</a>
                    `;
                } else {
                    navLinks.innerHTML = `
                        <a href="../explore/index.html">Card Explorer</a>
                        <a href="../open/collection.html">My Collection</a>
                        <a href="../login.html">Log In</a>
                    `;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', updateNavState);

        const family = JSON.parse(sessionStorage.getItem('fpc_family') || '{}');
        const childName = family.children ? family.children[0] : 'Friend';
        document.getElementById('childName').textContent = `Hey, ${childName}.`;
        
        function logout() {
            sessionStorage.clear();
            window.location.href = '../index.html';
        }
        
        function startPacking() {
            sessionStorage.setItem('fpc_in_pack_flow', 'true');
            window.location.href = 'search.html';
        }
    </script>
</body>
</html>
