<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Explorer — First Pull Cards</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap');
    
    html, body {
      background-color: #F7F9FB !important;
      color: #0F172A !important;
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif !important;
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.6;
    }
    
    h1, h2, h3, h4 {
      font-family: 'DM Sans', 'Arial Narrow', sans-serif !important;
      font-weight: 800 !important;
      color: #0F172A !important;
      letter-spacing: 0.02em;
    }
    
    .demo-nav {
      background: #FFFFFF !important;
      padding: 8px 16px;
      border-bottom: 1px solid #E4EAF0;
      font-size: 12px;
      position: sticky;
      top: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .demo-nav span {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 12px;
      color: #475569;
      margin-right: 8px;
    }
    
    .demo-nav a {
      color: #0F766E;
      text-decoration: none;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
    }
    
    .demo-nav a:hover {
      text-decoration: underline;
    }
    
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    
    h1 {
      font-size: 40px;
      margin: 0;
      color: #0F172A;
    }
    
    .cta-link {
      background: none;
      border: 1px solid #0F766E;
      color: #0F766E;
      padding: 12px 24px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease;
      display: inline-block;
      min-height: 44px;
      line-height: 1.4;
    }
    
    .cta-link:hover {
      background: #F0FDFA;
    }
    
    .search-section {
      margin-bottom: 40px;
    }
    
    .search-input {
      width: 100%;
      max-width: 560px;
      padding: 16px 20px;
      font-size: 18px;
      border: 1px solid #E4EAF0;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      color: #0F172A;
      background: #FFFFFF;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 56px;
      box-sizing: border-box;
    }
    
    .search-input:focus {
      outline: none;
      border-color: #0F766E;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }
    
    .search-input::placeholder {
      color: #475569;
    }
    
    .dropdown-list {
      display: none;
      position: absolute;
      top: 100%;
      width: 100%;
      max-width: 560px;
      background: #FFFFFF;
      border: 1px solid #E4EAF0;
      border-top: none;
      border-radius: 0 0 12px 12px;
      max-height: 300px;
      overflow-y: auto;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    
    .dropdown-list.show {
      display: block;
    }
    
    .dropdown-item {
      padding: 12px 16px;
      cursor: pointer;
      color: #0F172A;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 500;
      transition: background-color 0.2s;
      min-height: 48px;
      display: flex;
      align-items: center;
    }
    
    .dropdown-item:hover {
      background-color: #F0FDFA;
      color: #0F766E;
    }
    
    .card-display {
      display: none;
      text-align: center;
      margin: 40px 0;
      background: #FFFFFF;
      border: 1px solid #E4EAF0;
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .card-visual {
      background: linear-gradient(135deg, #F0FDFA 0%, #FFFFFF 100%);
      border: 2px solid #0F766E;
      border-radius: 8px;
      width: 180px;
      height: 252px;
      margin: 0 auto 24px;
      display: flex;
      flex-direction: column;
      padding: 12px;
      box-sizing: border-box;
    }
    
    .card-top {
      background: #0F766E;
      color: #FFFFFF;
      padding: 4px 8px;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    
    .card-middle {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    
    .card-player {
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
    }
    
    .card-team {
      font-size: 14px;
      color: #475569;
      margin-top: 4px;
      font-weight: 500;
    }
    
    .card-bottom {
      background: #F7F9FB;
      padding: 6px 8px;
      font-size: 12px;
      color: #0F766E;
      font-weight: 600;
      border-radius: 4px;
      margin-top: auto;
    }
    
    .card-info {
      margin-top: 24px;
      text-align: center;
    }
    
    .card-label {
      font-size: 14px;
      color: #475569;
      font-weight: 500;
      margin-bottom: 4px;
    }
    
    .card-value {
      font-size: 16px;
      color: #0F172A;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
    }
    
    .cta-primary {
      background: #0F766E;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      display: block;
      width: 100%;
      max-width: 400px;
      margin: 24px auto 0;
      min-height: 48px;
      transition: background 0.2s ease;
    }
    
    .cta-primary:hover {
      background: #0D5F58;
    }
    
    .rarity-badge {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #F59E0B;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 800;
      display: inline-block;
      margin-top: 12px;
      text-transform: uppercase;
    }
    
    .helper-text {
      text-align: center;
      font-size: 14px;
      color: #475569;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="demo-nav">
    <span>DEMO:</span>
    <a href="../index.html">Landing</a>
    <a href="../signup.html">Sign Up</a>
    <a href="../add-child.html">Add Child</a>
    <a href="index.html">Card Explorer</a>
    <a href="collection.html">Collection</a>
    <a href="../dashboard/index.html">Dashboard</a>
  </div>
  
  <main>
    <div class="page-header">
      <h1>FIND YOUR CARD</h1>
      <a href="collection.html" class="cta-link">View my collection</a>
    </div>
    
    <p style="text-align: center; color: #475569; font-size: 16px; margin-bottom: 32px;">Type a player name to see what you pulled.</p>
    
    <div class="search-section" style="position: relative; max-width: 560px;">
      <input 
        type="text" 
        id="playerSearch" 
        class="search-input" 
        placeholder="Search players... (try Cooper Flagg)"
      >
      <div class="dropdown-list" id="dropdown"></div>
    </div>
    
    <div class="card-display" id="cardDisplay">
      <div class="card-visual">
        <div class="card-top">
          <span>FIRST PULL CARDS</span>
          <span>2026-27</span>
        </div>
        <div class="card-middle">
          <div>
            <div class="card-player" id="cardName">Player Name</div>
            <div class="card-team" id="cardTeam">Team</div>
          </div>
        </div>
        <div class="card-bottom" id="cardValue">$0-$0</div>
      </div>
      
      <div class="card-info">
        <div class="card-label">Recent range</div>
        <div class="card-value" id="cardValueDisplay">$0-$0</div>
      </div>
      
      <div id="rarityBadgeContainer"></div>
      
      <button class="cta-primary" onclick="handleThatsMine()">THAT'S MINE</button>
    </div>
    
    <p class="helper-text">Click on a player to see their cards</p>
  </main>
  
  <script>
    const PLAYERS = [
      { name: 'Cooper Flagg', team: 'Celtics', low: 18, high: 34, rarity: 'rare' },
      { name: 'Ace Bailey', team: 'Nets', low: 12, high: 28 },
      { name: 'Dylan Harper', team: 'Pistons', low: 10, high: 22 },
      { name: 'VJ Edgecombe', team: 'Warriors', low: 8, high: 18 },
      { name: 'Kon Knueppel', team: 'Knicks', low: 6, high: 14 },
      { name: 'Tre Johnson', team: 'Wizards', low: 5, high: 11 },
      { name: 'LeBron James', team: 'Lakers', low: 22, high: 45, rarity: 'ultra-rare' },
      { name: 'Stephen Curry', team: 'Warriors', low: 20, high: 40 }
    ];
    
    let selectedCard = null;
    
    document.getElementById('playerSearch').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const dropdown = document.getElementById('dropdown');
      
      if (!query) {
        dropdown.classList.remove('show');
        return;
      }
      
      const matches = PLAYERS.filter(p => 
        p.name.toLowerCase().includes(query) || p.team.toLowerCase().includes(query)
      );
      
      if (matches.length === 0) {
        dropdown.innerHTML = '<div class="dropdown-item">No players found</div>';
        dropdown.classList.add('show');
        return;
      }
      
      dropdown.innerHTML = matches.map((p, idx) => `
        <div class="dropdown-item" onclick="selectCard('${p.name}', '${p.team}', ${p.low}, ${p.high}, '${p.rarity || ''}')">${p.name} — ${p.team}</div>
      `).join('');
      dropdown.classList.add('show');
    });
    
    function selectCard(name, team, low, high, rarity) {
      selectedCard = { name, team, low, high, rarity };
      
      document.getElementById('cardName').textContent = name;
      document.getElementById('cardTeam').textContent = team;
      document.getElementById('cardValue').textContent = `$${low}-$${high}`;
      document.getElementById('cardValueDisplay').textContent = `$${low}-$${high}`;
      document.getElementById('cardDisplay').style.display = 'block';
      document.getElementById('dropdown').classList.remove('show');
      document.getElementById('playerSearch').value = name;
      
      const badgeContainer = document.getElementById('rarityBadgeContainer');
      if (rarity === 'rare') {
        badgeContainer.innerHTML = '<div class="rarity-badge">RARE</div>';
      } else if (rarity === 'ultra-rare') {
        badgeContainer.innerHTML = '<div class="rarity-badge">ULTRA RARE</div>';
      } else {
        badgeContainer.innerHTML = '';
      }
    }
    
    function handleThatsMine() {
      if (!selectedCard) return;
      
      let collection = JSON.parse(sessionStorage.getItem('collection') || '[]');
      collection.push(selectedCard);
      sessionStorage.setItem('collection', JSON.stringify(collection));
      
      setTimeout(() => {
        window.location.href = 'collection.html';
      }, 500);
    }
  </script>
</body>
</html>
