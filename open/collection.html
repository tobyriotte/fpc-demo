<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Collection — First Pull Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            background: #F7F9FB !important; 
            font-family: 'Inter', sans-serif !important;
            color: #0F172A;
        }
        
        nav {
            background: #FFFFFF;
            border-bottom: 1px solid #E4EAF0;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
        }
        
        nav .logo {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            color: #0F172A;
        }
        
        nav .logo .teal { color: #0F766E; }
        
        nav .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        nav a {
            text-decoration: none;
            color: #0F766E;
            font-weight: 600;
            font-size: 14px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px;
        }
        
        h1 {
            font-family: 'DM Sans', sans-serif;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 48px;
            color: #0F172A;
            letter-spacing: -0.02em;
        }
        
        .counter {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: #475569;
            margin-bottom: 32px;
        }
        
        .empty-state {
            background: #FFFFFF;
            border: 1px solid #E4EAF0;
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            margin-bottom: 32px;
        }
        
        .empty-state p {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: #475569;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 48px;
        }
        
        .card-tile {
            background: #FFFFFF;
            border: 2px solid #E4EAF0;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
            padding: 12px;
        }
        
        .card-top {
            background: #0F766E;
            color: #FFFFFF;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'DM Sans', sans-serif;
            font-size: 9px;
            font-weight: 700;
        }
        
        .card-number {
            font-size: 11px;
            opacity: 0.3;
        }
        
        .card-year {
            font-size: 9px;
        }
        
        .card-image {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: #F0FDFA;
            border: 1px solid #E4EAF0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 11px;
            color: #0F766E;
        }
        
        .card-name {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #0F172A;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        
        .card-team {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            color: #475569;
            margin-bottom: 4px;
        }
        
        .card-price {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #0F766E;
        }
        
        .big-pull-section {
            background: #FFFFFF;
            border: 1px solid #E4EAF0;
            border-radius: 12px;
            padding: 32px 24px;
            margin-bottom: 32px;
        }
        
        .big-pull-section h2 {
            font-family: 'DM Sans', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #F59E0B;
            margin-bottom: 24px;
        }
        
        .cta-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 32px;
        }
        
        .btn-primary {
            background: #0F766E;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            height: 44px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background 0.2s;
        }
        
        .btn-primary:hover { background: #0D5F58; }
        
        .btn-secondary {
            background: transparent;
            color: #0F766E;
            border: 2px solid #0F766E;
            border-radius: 12px;
            padding: 10px 22px;
            height: 44px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background 0.2s;
        }
        
        .btn-secondary:hover { background: #F0FDFA; }
        
        .link {
            color: #0F766E;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-block;
            margin-top: 16px;
        }
        
        footer {
            background: #FFFFFF;
            border-top: 1px solid #E4EAF0;
            padding: 32px 24px;
            text-align: center;
            color: #64748B;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html" class="logo">FIRST PULL <span class="teal">CARDS</span></a>
        <div class="nav-links">
            <a href="../explore/index.html">Card Explorer</a>
            <a href="../open/collection.html">My Collection</a>
            <a href="../login.html">Log In</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>My Collection</h1>
        
        <div class="counter" id="counter"></div>
        
        <div id="emptyState" class="empty-state" style="display: none;">
            <p>Your collection is waiting. Find your first card.</p>
            <button class="btn-primary" onclick="window.location.href = 'search.html'">Find My Cards</button>
        </div>
        
        <div id="collectionContainer">
            <div class="card-grid" id="cardGrid"></div>
            
            <div class="big-pull-section" id="bigPullSection" style="display: none;">
                <h2>Your Big Pull</h2>
                <div id="bigPullContent"></div>
            </div>
            
            <div class="cta-row">
                <button class="btn-primary" onclick="window.location.href = 'search.html'">Find More Cards</button>
                <a href="../dashboard/index.html" class="btn-secondary">Go to Dashboard</a>
            </div>
        </div>
    </div>
    
    <footer>
        2026 First Pull Cards. Pilot program.
    </footer>
    
    <script>
        const players = [
            {name: 'Cooper Flagg', team: 'Boston Celtics', number: '001', rarity: 'Ultra Rare', low: 45, high: 89},
            {name: 'LeBron James', team: 'Los Angeles Lakers', number: '002', rarity: 'Rare', low: 18, high: 34},
            {name: 'Stephen Curry', team: 'Golden State Warriors', number: '003', rarity: 'Rare', low: 22, high: 41},
            {name: 'Dylan Harper', team: 'New Orleans Pelicans', number: '004', rarity: 'Uncommon', low: 8, high: 19},
            {name: 'Giannis Antetokounmpo', team: 'Milwaukee Bucks', number: '005', rarity: 'Rare', low: 15, high: 28},
            {name: 'Nikola Jokic', team: 'Denver Nuggets', number: '006', rarity: 'Rare', low: 20, high: 38},
            {name: 'Luka Doncic', team: 'Dallas Mavericks', number: '007', rarity: 'Ultra Rare', low: 35, high: 72},
            {name: 'Victor Wembanyama', team: 'San Antonio Spurs', number: '008', rarity: 'Ultra Rare', low: 55, high: 110},
            {name: 'Ja Morant', team: 'Memphis Grizzlies', number: '009', rarity: 'Uncommon', low: 12, high: 24},
            {name: 'Jayson Tatum', team: 'Boston Celtics', number: '010', rarity: 'Common', low: 4, high: 9},
            {name: 'Anthony Edwards', team: 'Minnesota Timberwolves', number: '011', rarity: 'Uncommon', low: 10, high: 22},
            {name: 'Cade Cunningham', team: 'Detroit Pistons', number: '012', rarity: 'Common', low: 3, high: 8}
        ];
        
        function renderCollection() {
            const collection = JSON.parse(localStorage.getItem('fpc_collection') || '[]');
            
            if (collection.length === 0) {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('collectionContainer').style.display = 'none';
                return;
            }
            
            document.getElementById('counter').textContent = `${collection.length} Cards`;
            
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = collection.map(card => `
                <div class="card-tile">
                    <div class="card-top">
                        <span class="card-number">#${card.number}</span>
                        <span class="card-year">2026-27</span>
                    </div>
                    <div class="card-image">Card</div>
                    <div class="card-name">${card.name}</div>
                    <div class="card-team">${card.team}</div>
                    <div class="card-price">$${card.low}–$${card.high}</div>
                </div>
            `).join('');
            
            // Show big pull (highest rarity)
            const rarityOrder = { 'Ultra Rare': 4, 'Rare': 3, 'Uncommon': 2, 'Common': 1 };
            const sortedByRarity = collection.slice().sort((a, b) => (rarityOrder[b.rarity] || 0) - (rarityOrder[a.rarity] || 0));
            
            if (sortedByRarity.length > 0) {
                const bigPull = sortedByRarity[0];
                document.getElementById('bigPullSection').style.display = 'block';
                document.getElementById('bigPullContent').innerHTML = `
                    <div style="text-align: center;">
                        <div class="card-image" style="margin: 0 auto 24px; width: 160px; height: 240px;">Card</div>
                        <div class="card-name" style="font-size: 20px; margin-bottom: 8px;">${bigPull.name}</div>
                        <div class="card-team">${bigPull.team}</div>
                        <div style="margin: 16px 0; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; color: #F59E0B;">RARITY: ${bigPull.rarity}</div>
                        <div class="card-price" style="font-size: 14px;">$${bigPull.low}–$${bigPull.high}</div>
                        <button class="btn-primary" onclick="window.location.href = 'big-pull.html'" style="margin-top: 24px;">View Big Pull</button>
                    </div>
                `;
            }
        }
        
        renderCollection();
    </script>
</body>
</html>
