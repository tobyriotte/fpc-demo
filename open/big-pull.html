<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Big Pull — First Pull Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            background: #F0FDFA !important; 
            font-family: 'Inter', sans-serif !important;
            color: #0F172A;
        }
        
        nav {
            background: #FFFFFF;
            border-bottom: 1px solid #E4EAF0;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
        }
        
        nav .logo {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            color: #0F172A;
        }
        
        nav .logo .teal { color: #0F766E; }
        
        nav .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        nav a {
            text-decoration: none;
            color: #0F766E;
            font-weight: 600;
            font-size: 14px;
        }
        
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 80px 24px;
            text-align: center;
        }
        
        h1 {
            font-family: 'DM Sans', sans-serif;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 32px;
            color: #0F766E;
            letter-spacing: -0.02em;
        }
        
        .card-image {
            width: 200px;
            height: 280px;
            background: #FFFFFF;
            border: 2px solid #E4EAF0;
            border-radius: 12px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #0F766E;
        }
        
        .card-name {
            font-family: 'DM Sans', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #0F172A;
        }
        
        .card-team {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #475569;
            margin-bottom: 16px;
        }
        
        .rarity-label {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #F59E0B;
            margin-bottom: 8px;
        }
        
        .value-band {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #0F766E;
            margin-bottom: 32px;
        }
        
        .cta-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .btn-primary {
            background: #0F766E;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            height: 44px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background 0.2s;
        }
        
        .btn-primary:hover { background: #0D5F58; }
        
        .btn-secondary {
            background: transparent;
            color: #0F766E;
            border: 2px solid #0F766E;
            border-radius: 12px;
            padding: 10px 22px;
            height: 44px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background 0.2s;
        }
        
        .btn-secondary:hover { background: #F0FDFA; }
        
        footer {
            background: #FFFFFF;
            border-top: 1px solid #E4EAF0;
            padding: 32px 24px;
            text-align: center;
            color: #64748B;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin-top: 64px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html" class="logo">FIRST PULL <span class="teal">CARDS</span></a>
        <div class="nav-links">
            <a href="../explore/index.html">Explore</a>
            <a href="../gallery.html">Gallery</a>
            <a href="../login.html">Log In</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>Your Big Pull</h1>
        
        <div class="card-image" id="cardImage">Card</div>
        
        <div class="card-name" id="cardName"></div>
        <div class="card-team" id="cardTeam"></div>
        
        <div class="rarity-label" id="rarityLabel"></div>
        <div class="value-band" id="valueband"></div>
        
        <div class="cta-row">
            <button class="btn-primary" onclick="window.location.href = 'submit.html'">Submit a Photo</button>
            <a href="collection.html" class="btn-secondary">Back to Collection</a>
        </div>
    </div>
    
    <footer>
        2026 First Pull Cards. Pilot program.
    </footer>
    
    <script>
        const players = [
            {name: 'Cooper Flagg', team: 'Boston Celtics', number: '001', rarity: 'Ultra Rare', low: 45, high: 89},
            {name: 'LeBron James', team: 'Los Angeles Lakers', number: '002', rarity: 'Rare', low: 18, high: 34},
            {name: 'Stephen Curry', team: 'Golden State Warriors', number: '003', rarity: 'Rare', low: 22, high: 41},
            {name: 'Dylan Harper', team: 'New Orleans Pelicans', number: '004', rarity: 'Uncommon', low: 8, high: 19},
            {name: 'Giannis Antetokounmpo', team: 'Milwaukee Bucks', number: '005', rarity: 'Rare', low: 15, high: 28},
            {name: 'Nikola Jokic', team: 'Denver Nuggets', number: '006', rarity: 'Rare', low: 20, high: 38},
            {name: 'Luka Doncic', team: 'Dallas Mavericks', number: '007', rarity: 'Ultra Rare', low: 35, high: 72},
            {name: 'Victor Wembanyama', team: 'San Antonio Spurs', number: '008', rarity: 'Ultra Rare', low: 55, high: 110},
            {name: 'Ja Morant', team: 'Memphis Grizzlies', number: '009', rarity: 'Uncommon', low: 12, high: 24},
            {name: 'Jayson Tatum', team: 'Boston Celtics', number: '010', rarity: 'Common', low: 4, high: 9},
            {name: 'Anthony Edwards', team: 'Minnesota Timberwolves', number: '011', rarity: 'Uncommon', low: 10, high: 22},
            {name: 'Cade Cunningham', team: 'Detroit Pistons', number: '012', rarity: 'Common', low: 3, high: 8}
        ];
        
        function findBigPull() {
            const collection = JSON.parse(sessionStorage.getItem('fpc_collection') || '[]');
            
            if (collection.length === 0) {
                window.location.href = 'collection.html';
                return;
            }
            
            const rarityOrder = { 'Ultra Rare': 4, 'Rare': 3, 'Uncommon': 2, 'Common': 1 };
            const sortedByRarity = collection.slice().sort((a, b) => (rarityOrder[b.rarity] || 0) - (rarityOrder[a.rarity] || 0));
            
            const bigPull = sortedByRarity[0];
            document.getElementById('cardName').textContent = bigPull.name;
            document.getElementById('cardTeam').textContent = bigPull.team;
            document.getElementById('rarityLabel').textContent = `RARITY: ${bigPull.rarity}`;
            document.getElementById('valueband').textContent = `Recent sales: $${bigPull.low} - $${bigPull.high}`;
        }
        
        findBigPull();
    </script>
</body>
</html>
