<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find My Cards - First Pull Cards</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#F7F9FB!important;font-family:'Inter','Helvetica Neue',Arial,sans-serif!important;color:#0F172A!important;min-height:100vh;}
h1,h2,h3{font-family:'DM Sans','Arial Narrow',sans-serif!important;font-weight:800!important;color:#0F172A!important;}
nav{background:#fff;border-bottom:1px solid #E4EAF0;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-family:'DM Sans',sans-serif;font-weight:800;font-size:18px;color:#0F172A;text-decoration:none;}
.logo .pull{color:#0F766E;}
.nav-links{display:flex;gap:24px;align-items:center;}
.nav-links a{font-family:'Inter',sans-serif;font-size:14px;color:#475569;text-decoration:none;}
.nav-links a.login{color:#0F766E;font-weight:600;}
.container{max-width:640px;margin:0 auto;padding:48px 24px;}
.page-title{font-size:40px;text-align:center;margin-bottom:8px;}
.page-sub{text-align:center;color:#475569;font-size:16px;margin-bottom:8px;}
.counter{text-align:center;color:#0F766E;font-weight:600;font-size:14px;margin-bottom:32px;}
.search-wrap{position:relative;max-width:560px;margin:0 auto 32px;}
.search-input{width:100%;height:56px;padding:0 20px 0 48px;border:1px solid #E4EAF0;border-radius:12px;font-size:18px;font-family:'Inter',sans-serif;color:#0F172A;background:#fff;outline:none;}
.search-input:focus{border-color:#0F766E;box-shadow:0 0 0 3px rgba(15,118,110,0.12);}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#94A3B8;pointer-events:none;}
.dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #E4EAF0;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.08);z-index:50;display:none;max-height:260px;overflow-y:auto;}
.dropdown.open{display:block;}
.dropdown-item{padding:0 20px;height:48px;display:flex;align-items:center;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;font-size:15px;color:#0F172A;border-bottom:1px solid #F7F9FB;}
.dropdown-item:last-child{border-bottom:none;}
.dropdown-item:hover,.dropdown-item.selected{background:#F0FDFA;}
.dropdown-item .item-team{font-size:13px;color:#475569;margin-left:8px;font-weight:400;}
.card-panel{background:#fff;border:1px solid #E4EAF0;border-radius:16px;padding:32px;max-width:480px;margin:0 auto 32px;display:none;text-align:center;}
.card-panel.visible{display:block;}
.card-visual{width:200px;height:280px;border:2px solid #E4EAF0;border-radius:6px;background:#F7F9FB;overflow:hidden;margin:0 auto 20px;display:flex;flex-direction:column;}
.cv-top{background:#0F766E;color:#fff;font-family:'DM Sans',sans-serif;font-weight:700;font-size:9px;padding:5px 8px;display:flex;justify-content:space-between;flex-shrink:0;}
.cv-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 8px;position:relative;}
.cv-ghost{position:absolute;font-family:'DM Sans',sans-serif;font-weight:800;font-size:72px;color:rgba(15,118,110,0.07);line-height:1;}
.cv-player{font-family:'DM Sans',sans-serif;font-weight:800;font-size:20px;color:#0F172A;text-align:center;position:relative;z-index:1;line-height:1.2;}
.cv-team{font-family:'Inter',sans-serif;font-size:13px;color:#475569;margin-top:4px;position:relative;z-index:1;}
.cv-bot{background:#F7F9FB;border-top:1px solid #E4EAF0;padding:6px 8px;font-family:'Inter',sans-serif;font-size:11px;color:#0F766E;font-weight:600;text-align:center;flex-shrink:0;}
.rarity-badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;font-family:'Inter',sans-serif;margin-bottom:16px;}
.rarity-Common{background:#F1F5F9;color:#64748B;}
.rarity-Uncommon{background:#F0FDFA;color:#0F766E;}
.rarity-Rare{background:#EFF6FF;color:#3B82F6;}
.rarity-UltraRare{background:#FFFBEB;color:#F59E0B;}
.btn-mine{width:100%;height:48px;background:#0F766E;color:#fff;font-family:'DM Sans',sans-serif;font-weight:700;font-size:18px;border:none;border-radius:8px;cursor:pointer;margin-top:4px;}
.btn-mine:hover{background:#0D5F58;}
.value-label{font-family:'Inter',sans-serif;font-size:14px;color:#475569;margin-top:12px;}
.value-label strong{color:#0F172A;}
.btn-done{display:block;width:100%;max-width:560px;margin:0 auto;height:48px;background:transparent;border:1px solid #0F766E;color:#0F766E;font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;border-radius:8px;cursor:pointer;}
.btn-done:hover{background:#F0FDFA;}
.celebration{position:fixed;inset:0;background:rgba(15,118,110,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.celebration.show{opacity:1;pointer-events:all;}
.cel-title{font-family:'DM Sans',sans-serif;font-weight:800;font-size:40px;color:#fff;margin-bottom:8px;}
.cel-name{font-family:'DM Sans',sans-serif;font-weight:800;font-size:24px;color:rgba(255,255,255,0.9);margin-bottom:24px;}
.cel-hint{font-family:'Inter',sans-serif;font-size:14px;color:rgba(255,255,255,0.7);}
</style>
</head>
<body>
<nav>
  <a href="../index.html" class="logo">FIRST <span class="pull">PULL</span> CARDS</a>
  <div class="nav-links">
    <a href="../explore/index.html">Explore</a>
    <a href="../gallery.html">Gallery</a>
    <a href="../login.html" class="login">Log In</a>
  </div>
</nav>
<div class="container">
  <h1 class="page-title">Find My Cards</h1>
  <p class="page-sub">Type a player name to find your card.</p>
  <p class="counter" id="counter">0 cards in collection</p>

  <div class="search-wrap">
    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" class="search-input" placeholder="Search players..." autocomplete="off">
    <div class="dropdown" id="dropdown"></div>
  </div>

  <div class="card-panel" id="cardPanel">
    <div class="card-visual" id="cardVisual">
      <div class="cv-top"><span>FIRST PULL CARDS</span><span>2026-27</span></div>
      <div class="cv-mid">
        <span class="cv-ghost" id="ghostNum"></span>
        <span class="cv-player" id="cvPlayer"></span>
        <span class="cv-team" id="cvTeam"></span>
      </div>
      <div class="cv-bot" id="cvPrice"></div>
    </div>
    <div id="rarityBadge" class="rarity-badge"></div>
    <button class="btn-mine" id="btnMine">That's Mine</button>
    <p class="value-label">Recent sales: <strong id="valueRange"></strong></p>
  </div>

  <button class="btn-done" onclick="window.location.href='collection.html'">Done with my cards</button>
</div>

<div class="celebration" id="celebration" onclick="dismissCelebration()">
  <div class="cel-title">Added to Your Collection</div>
  <div class="cel-name" id="celName"></div>
  <div class="cel-hint">Tap anywhere to continue</div>
</div>

<script>
const players=[
  {name:'Cooper Flagg',team:'Boston Celtics',number:'001',rarity:'Ultra Rare',low:45,high:89},
  {name:'LeBron James',team:'Los Angeles Lakers',number:'002',rarity:'Rare',low:18,high:34},
  {name:'Stephen Curry',team:'Golden State Warriors',number:'003',rarity:'Rare',low:22,high:41},
  {name:'Dylan Harper',team:'New Orleans Pelicans',number:'004',rarity:'Uncommon',low:8,high:19},
  {name:'Giannis Antetokounmpo',team:'Milwaukee Bucks',number:'005',rarity:'Rare',low:15,high:28},
  {name:'Nikola Jokic',team:'Denver Nuggets',number:'006',rarity:'Rare',low:20,high:38},
  {name:'Luka Doncic',team:'Dallas Mavericks',number:'007',rarity:'Ultra Rare',low:35,high:72},
  {name:'Victor Wembanyama',team:'San Antonio Spurs',number:'008',rarity:'Ultra Rare',low:55,high:110},
  {name:'Ja Morant',team:'Memphis Grizzlies',number:'009',rarity:'Uncommon',low:12,high:24},
  {name:'Jayson Tatum',team:'Boston Celtics',number:'010',rarity:'Common',low:4,high:9},
  {name:'Anthony Edwards',team:'Minnesota Timberwolves',number:'011',rarity:'Uncommon',low:10,high:22},
  {name:'Cade Cunningham',team:'Detroit Pistons',number:'012',rarity:'Common',low:3,high:8},
];
let currentPlayer=null;
let celTimer=null;

function updateCounter(){
  const col=JSON.parse(sessionStorage.getItem('fpc_collection')||'[]');
  document.getElementById('counter').textContent=col.length+' card'+(col.length!==1?'s':'')+' in collection';
}
updateCounter();

const input=document.getElementById('searchInput');
const dropdown=document.getElementById('dropdown');

input.addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();
  if(q.length<1){dropdown.classList.remove('open');dropdown.innerHTML='';return;}
  const matches=players.filter(p=>p.name.toLowerCase().includes(q));
  if(!matches.length){dropdown.innerHTML='<div class="dropdown-item" style="color:#94A3B8">No players found</div>';dropdown.classList.add('open');return;}
  dropdown.innerHTML=matches.map(p=>`<div class="dropdown-item" onclick="selectPlayer('${p.name}')"><span>${p.name}</span><span class="item-team">${p.team}</span></div>`).join('');
  dropdown.classList.add('open');
});

document.addEventListener('click',function(e){
  if(!e.target.closest('.search-wrap')){dropdown.classList.remove('open');}
});

function selectPlayer(name){
  currentPlayer=players.find(p=>p.name===name);
  if(!currentPlayer)return;
  input.value=name;
  dropdown.classList.remove('open');
  document.getElementById('cvPlayer').textContent=currentPlayer.name;
  document.getElementById('cvTeam').textContent=currentPlayer.team;
  document.getElementById('ghostNum').textContent='#'+currentPlayer.number;
  document.getElementById('cvPrice').textContent='Recent sales: $'+currentPlayer.low+' - $'+currentPlayer.high;
  document.getElementById('valueRange').textContent='$'+currentPlayer.low+' - $'+currentPlayer.high;
  const rKey='rarity-'+currentPlayer.rarity.replace(' ','');
  const badge=document.getElementById('rarityBadge');
  badge.textContent=currentPlayer.rarity;
  badge.className='rarity-badge '+rKey;
  document.getElementById('cardPanel').classList.add('visible');
}

document.getElementById('btnMine').addEventListener('click',function(){
  if(!currentPlayer)return;
  const col=JSON.parse(sessionStorage.getItem('fpc_collection')||'[]');
  col.push({name:currentPlayer.name,team:currentPlayer.team,number:currentPlayer.number,rarity:currentPlayer.rarity,low:currentPlayer.low,high:currentPlayer.high});
  sessionStorage.setItem('fpc_collection',JSON.stringify(col));
  updateCounter();
  document.getElementById('celName').textContent=currentPlayer.name;
  document.getElementById('celebration').classList.add('show');
  if(celTimer)clearTimeout(celTimer);
  celTimer=setTimeout(dismissCelebration,2500);
});

function dismissCelebration(){
  document.getElementById('celebration').classList.remove('show');
  input.value='';
  document.getElementById('cardPanel').classList.remove('visible');
  currentPlayer=null;
  input.focus();
}
</script>
</body>
</html>
