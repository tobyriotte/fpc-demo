<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — First Pull Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            background: #F7F9FB !important; 
            font-family: 'Inter', sans-serif !important;
            color: #0F172A;
        }
        
        nav {
            background: #FFFFFF;
            border-bottom: 1px solid #E4EAF0;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
        }
        
        nav .logo {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            color: #0F172A;
        }
        
        nav .logo .teal { color: #0F766E; }
        
        nav .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        nav a {
            text-decoration: none;
            color: #0F766E;
            font-weight: 600;
            font-size: 14px;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 80px 24px;
        }
        
        h2 {
            font-family: 'DM Sans', sans-serif;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 32px;
            text-align: center;
            color: #0F172A;
            letter-spacing: -0.02em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #0F172A;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E4EAF0;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            color: #0F172A;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #0F766E;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
        }
        
        .form-group input::placeholder {
            color: #475569;
        }
        
        .btn-primary {
            width: 100%;
            background: #0F766E;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            height: 44px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            margin-top: 24px;
        }
        
        .btn-primary:hover { background: #0D5F58; }
        
        .links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }
        
        .links a {
            color: #0F766E;
            text-decoration: none;
            font-weight: 600;
            display: block;
            margin-top: 12px;
        }
        
        .error { 
            color: #dc2626;
            font-size: 12px;
            margin-top: 4px;
        }
        
        footer {
            background: #FFFFFF;
            border-top: 1px solid #E4EAF0;
            padding: 32px 24px;
            text-align: center;
            color: #64748B;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        
        body { padding-bottom: 100px; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">FIRST PULL <span class="teal">CARDS</span></a>
        <div class="nav-links">
            <a href="explore/index.html">Explore</a>
            <a href="gallery.html">Gallery</a>
            <a href="login.html">Log In</a>
        </div>
    </nav>
    
    <div class="container">
        <h2>Log In</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="your@email.com">
                <div class="error" id="emailError"></div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
                <div class="error" id="passwordError"></div>
            </div>
            
            <button type="submit" class="btn-primary">Log In</button>
        </form>
        
        <div class="links">
            <a href="password-reset.html">Forgot password?</a>
            <a href="index.html">New family? Register</a>
        </div>
    </div>
    
    <footer>
        2026 First Pull Cards. Pilot program.
    </footer>
    
    <script>
        function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // For demo: simple check
            if (!email || !password) {
                document.getElementById('emailError').textContent = 'Email and password required';
                return;
            }
            
            // Save to sessionStorage
            sessionStorage.setItem('fpc_logged_in', 'true');
            sessionStorage.setItem('fpc_family', JSON.stringify({
                email: email,
                parentName: 'Parent',
                children: ['Child 1']
            }));
            
            window.location.href = 'dashboard/index.html';
        }
    </script>
</body>
</html>
