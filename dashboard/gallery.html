<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Photos — First Pull Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            background: #F7F9FB !important; 
            font-family: 'Inter', sans-serif !important;
            color: #0F172A;
        }
        
        nav {
            background: #FFFFFF;
            border-bottom: 1px solid #E4EAF0;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
        }
        
        nav .logo {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            color: #0F172A;
        }
        
        nav .logo .teal { color: #0F766E; }
        
        nav .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        nav a {
            text-decoration: none;
            color: #0F766E;
            font-weight: 600;
            font-size: 14px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 24px;
        }
        
        h1 {
            font-family: 'DM Sans', sans-serif;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 48px;
            color: #0F172A;
            letter-spacing: -0.02em;
        }
        
        .photo-row {
            background: #FFFFFF;
            border: 1px solid #E4EAF0;
            border-radius: 12px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 16px;
        }
        
        .photo-placeholder {
            width: 80px;
            height: 80px;
            background: #F0FDFA;
            border: 1px solid #E4EAF0;
            border-radius: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0F766E;
            font-size: 11px;
            font-weight: 600;
        }
        
        .photo-info {
            flex: 1;
            font-family: 'Inter', sans-serif;
        }
        
        .photo-info div {
            font-size: 14px;
            margin-bottom: 4px;
            color: #0F172A;
        }
        
        .photo-info .meta {
            font-size: 12px;
            color: #475569;
        }
        
        .photo-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .btn-approve {
            background: #0F766E;
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }
        
        .btn-approve:hover { background: #0D5F58; }
        
        .btn-reject {
            background: transparent;
            color: #dc2626;
            border: 1px solid #dc2626;
            border-radius: 8px;
            padding: 8px 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }
        
        .btn-reject:hover { background: rgba(220, 38, 38, 0.05); }
        
        .back-link {
            margin-top: 32px;
            text-align: center;
        }
        
        .back-link a {
            color: #0F766E;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        
        footer {
            background: #FFFFFF;
            border-top: 1px solid #E4EAF0;
            padding: 32px 24px;
            text-align: center;
            color: #64748B;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin-top: 64px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html" class="logo">FIRST PULL <span class="teal">CARDS</span></a>
        <div class="nav-links">
            <a href="../explore/index.html">Explore</a>
            <a href="../gallery.html">Gallery</a>
            <a href="../login.html">Log In</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>Pending Photos</h1>
        
        <div class="photo-row">
            <div class="photo-placeholder">Card</div>
            <div class="photo-info">
                <div>Child Name</div>
                <div class="meta">Cooper Flagg</div>
            </div>
            <div class="photo-actions">
                <button class="btn-approve">Approve</button>
                <button class="btn-reject">Reject</button>
            </div>
        </div>
        
        <div class="photo-row">
            <div class="photo-placeholder">Card</div>
            <div class="photo-info">
                <div>Child Name</div>
                <div class="meta">Luka Doncic</div>
            </div>
            <div class="photo-actions">
                <button class="btn-approve">Approve</button>
                <button class="btn-reject">Reject</button>
            </div>
        </div>
        
        <div class="photo-row">
            <div class="photo-placeholder">Card</div>
            <div class="photo-info">
                <div>Child Name</div>
                <div class="meta">Wembanyama</div>
            </div>
            <div class="photo-actions">
                <button class="btn-approve">Approve</button>
                <button class="btn-reject">Reject</button>
            </div>
        </div>
        
        <div class="back-link">
            <a href="index.html">Back to Dashboard</a>
        </div>
    </div>
    
    <footer>
        2026 First Pull Cards. Pilot program.
    </footer>
</body>
</html>
