<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings — First Pull Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            background: #F7F9FB !important; 
            font-family: 'Inter', sans-serif !important;
            color: #0F172A;
        }
        
        nav {
            background: #FFFFFF;
            border-bottom: 1px solid #E4EAF0;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
        }
        
        nav .logo {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            color: #0F172A;
        }
        
        nav .logo .teal { color: #0F766E; }
        
        nav .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        nav a {
            text-decoration: none;
            color: #0F766E;
            font-weight: 600;
            font-size: 14px;
        }
        
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 80px 24px;
        }
        
        h1 {
            font-family: 'DM Sans', sans-serif;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 48px;
            color: #0F172A;
            letter-spacing: -0.02em;
        }
        
        .section {
            background: #FFFFFF;
            border: 1px solid #E4EAF0;
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 24px;
        }
        
        .section h2 {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #0F172A;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #0F172A;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E4EAF0;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            color: #0F172A;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #0F766E;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
        }
        
        .form-group input:disabled {
            background: #F7F9FB;
            color: #64748B;
        }
        
        .form-group .meta {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #475569;
            margin-top: 4px;
        }
        
        .btn-primary {
            background: #0F766E;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            height: 44px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            margin-top: 24px;
        }
        
        .btn-primary:hover { background: #0D5F58; }
        
        .btn-danger {
            background: #dc2626;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            height: 44px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            margin-top: 24px;
        }
        
        .btn-danger:hover { background: #b91c1c; }
        
        .danger-section {
            border-color: #fca5a5;
            background: #fef2f2;
        }
        
        .danger-section h2 {
            color: #dc2626;
        }
        
        .danger-text {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: #475569;
            line-height: 1.6;
        }
        
        .back-link {
            margin-top: 32px;
            text-align: center;
        }
        
        .back-link a {
            color: #0F766E;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        
        footer {
            background: #FFFFFF;
            border-top: 1px solid #E4EAF0;
            padding: 32px 24px;
            text-align: center;
            color: #64748B;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin-top: 64px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html" class="logo">FIRST PULL <span class="teal">CARDS</span></a>
        <div class="nav-links">
            <a href="../explore/index.html">Card Explorer</a>
            <a href="../open/collection.html">My Collection</a>
            <a href="../login.html" onclick="logout();">Log Out</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>Account Settings</h1>
        
        <div class="section">
            <h2>Email</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" disabled>
            </div>
        </div>
        
        <div class="section">
            <h2>Change Password</h2>
            <form onsubmit="handlePasswordChange(event)">
                <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Save Password</button>
            </form>
        </div>
        
        <div class="section danger-section">
            <h2>Danger Zone</h2>
            <p class="danger-text">Contact support to delete your account and all associated data.</p>
            <button class="btn-danger" onclick="alert('Contact support at support@firstpullcards.com')">Delete Account</button>
        </div>
        
        <div class="back-link">
            <a href="index.html">Back to Dashboard</a>
        </div>
    </div>
    
    <footer>
        2026 First Pull Cards. Pilot program.
    </footer>
    
    <script>
        const family = JSON.parse(sessionStorage.getItem('fpc_family') || '{}');
        document.getElementById('email').value = family.email || 'parent@example.com';
        
        function handlePasswordChange(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            if (newPassword.length < 8) {
                alert('Password must be 8+ characters');
                return;
            }
            
            alert('Password updated successfully!');
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        }
        
        function logout() {
            sessionStorage.clear();
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
