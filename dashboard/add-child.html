<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add a Child — First Pull Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            background: #F7F9FB !important; 
            font-family: 'Inter', sans-serif !important;
            color: #0F172A;
        }
        
        nav {
            background: #FFFFFF;
            border-bottom: 1px solid #E4EAF0;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
        }
        
        nav .logo {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            color: #0F172A;
        }
        
        nav .logo .teal { color: #0F766E; }
        
        nav .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        nav a {
            text-decoration: none;
            color: #0F766E;
            font-weight: 600;
            font-size: 14px;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 80px 24px;
        }
        
        h2 {
            font-family: 'DM Sans', sans-serif;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 32px;
            text-align: center;
            color: #0F172A;
            letter-spacing: -0.02em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #0F172A;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E4EAF0;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            color: #0F172A;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #0F766E;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
        }
        
        .btn-primary {
            width: 100%;
            background: #0F766E;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            height: 44px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            margin-top: 24px;
        }
        
        .btn-primary:hover { background: #0D5F58; }
        
        .cancel-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .cancel-link a {
            color: #0F766E;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        
        footer {
            background: #FFFFFF;
            border-top: 1px solid #E4EAF0;
            padding: 32px 24px;
            text-align: center;
            color: #64748B;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
        
        body { padding-bottom: 100px; }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html" class="logo">FIRST PULL <span class="teal">CARDS</span></a>
        <div class="nav-links">
            <a href="../explore/index.html">Card Explorer</a>
            <a href="../open/collection.html">My Collection</a>
            <a href="../login.html">Log In</a>
        </div>
    </nav>
    
    <div class="container">
        <h2>Add a Child</h2>
        <form onsubmit="handleAddChild(event)">
            <div class="form-group">
                <label for="childName">Child Name *</label>
                <input type="text" id="childName" required placeholder="Child name">
            </div>
            
            <div class="form-group">
                <label for="age">Age *</label>
                <select id="age" required>
                    <option value="">Select age</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                </select>
            </div>
            
            <button type="submit" class="btn-primary">Add Child</button>
        </form>
        
        <div class="cancel-link">
            <a href="index.html">Cancel</a>
        </div>
    </div>
    
    <footer>
        2026 First Pull Cards. Pilot program.
    </footer>
    
    <script>
        function handleAddChild(e) {
            e.preventDefault();
            
            const name = document.getElementById('childName').value.trim();
            const family = JSON.parse(sessionStorage.getItem('fpc_family') || '{}');
            
            if (!family.children) family.children = [];
            family.children.push(name);
            
            sessionStorage.setItem('fpc_family', JSON.stringify(family));
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }
    </script>
</body>
</html>
