<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — First Pull Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            background: #F7F9FB !important; 
            font-family: 'Inter', sans-serif !important;
            color: #0F172A;
        }
        
        nav {
            background: #FFFFFF;
            border-bottom: 1px solid #E4EAF0;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
        }
        
        nav .logo {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            color: #0F172A;
        }
        
        nav .logo .teal { color: #0F766E; }
        
        nav .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        nav a {
            text-decoration: none;
            color: #0F766E;
            font-weight: 600;
            font-size: 14px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px;
        }
        
        h1 {
            font-family: 'DM Sans', sans-serif;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #0F172A;
            letter-spacing: -0.02em;
        }
        
        .subhead {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 400;
            color: #475569;
            margin-bottom: 48px;
            line-height: 1.6;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 48px;
        }
        
        .gallery-tile {
            background: #FFFFFF;
            border: 1px solid #E4EAF0;
            border-radius: 12px;
            overflow: hidden;
            text-align: center;
        }
        
        .gallery-placeholder {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: #F0FDFA;
            border: 2px solid #E4EAF0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0F766E;
            font-size: 12px;
            font-weight: 600;
        }
        
        .gallery-name {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #0F172A;
            padding: 12px 8px;
        }
        
        .cta-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .btn-primary {
            background: #0F766E;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            height: 44px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background 0.2s;
        }
        
        .btn-primary:hover { background: #0D5F58; }
        
        footer {
            background: #FFFFFF;
            border-top: 1px solid #E4EAF0;
            padding: 32px 24px;
            text-align: center;
            color: #64748B;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin-top: 64px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">FIRST PULL <span class="teal">CARDS</span></a>
        <div class="nav-links">
            <a href="explore/index.html">Card Explorer</a>
            <a href="open/collection.html">My Collection</a>
            <a href="login.html">Log In</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>Big Pulls From The Community</h1>
        <p class="subhead">Parent-approved photos from the pilot.</p>
        
        <div class="gallery-grid">
            <div class="gallery-tile">
                <div class="gallery-placeholder">Card</div>
                <div class="gallery-name">Cooper Flagg</div>
            </div>
            <div class="gallery-tile">
                <div class="gallery-placeholder">Card</div>
                <div class="gallery-name">Wembanyama</div>
            </div>
            <div class="gallery-tile">
                <div class="gallery-placeholder">Card</div>
                <div class="gallery-name">Luka Doncic</div>
            </div>
            <div class="gallery-tile">
                <div class="gallery-placeholder">Card</div>
                <div class="gallery-name">Dylan Harper</div>
            </div>
            <div class="gallery-tile">
                <div class="gallery-placeholder">Card</div>
                <div class="gallery-name">Ja Morant</div>
            </div>
            <div class="gallery-tile">
                <div class="gallery-placeholder">Card</div>
                <div class="gallery-name">Giannis</div>
            </div>
        </div>
        
        <div class="cta-row">
            <button class="btn-primary" onclick="window.location.href = 'open/submit.html'">Submit Your Photo</button>
        </div>
    </div>
    
    <footer>
        2026 First Pull Cards. Pilot program.
    </footer>
</body>
</html>
