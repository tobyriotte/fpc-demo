<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How It Works — First Pull Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            background: #F7F9FB !important; 
            font-family: 'Inter', sans-serif !important;
            color: #0F172A;
        }
        
        nav {
            background: #FFFFFF;
            border-bottom: 1px solid #E4EAF0;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
        }
        
        nav .logo {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            color: #0F172A;
        }
        
        nav .logo .teal { color: #0F766E; }
        
        nav .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        nav a {
            text-decoration: none;
            color: #0F766E;
            font-weight: 600;
            font-size: 14px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 24px;
            text-align: center;
        }
        
        h1 {
            font-family: 'DM Sans', sans-serif;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 24px;
            color: #0F172A;
            letter-spacing: -0.02em;
        }
        
        .video-box {
            background: #F0FDFA;
            border: 2px solid #E4EAF0;
            border-radius: 12px;
            padding: 60px 24px;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 16 / 9;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .video-box-text {
            font-family: 'DM Sans', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 12px;
        }
        
        .video-box-subtext {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #475569;
        }
        
        .btn-primary {
            background: #0F766E;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            height: 44px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background 0.2s;
        }
        
        .btn-primary:hover { background: #0D5F58; }
        
        .back-link {
            margin-top: 32px;
        }
        
        .back-link a {
            color: #0F766E;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        
        footer {
            background: #FFFFFF;
            border-top: 1px solid #E4EAF0;
            padding: 32px 24px;
            text-align: center;
            color: #64748B;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }

    <nav>
        <a href="index.html" class="logo">FIRST PULL <span class="teal">CARDS</span></a>

            <a href="login.html">Log In</a>
        </div>

    <div class="container">

        <div class="video-box">
            <div class="video-box-text">First Pull Cards intro video</div>
            <div class="video-box-subtext">Toby records this before the pilot ships.</div>
        </div>
        
        <div class="back-link">
            <a href="dashboard/index.html">Back to Dashboard</a>
        </div>
    </div>
    
    <footer>
        2026 First Pull Cards. Pilot program.
    </footer>
