<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Complete — First Pull Cards</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Inter:wght@400;500;600&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            background: #F7F9FB !important; 
            font-family: 'Inter', sans-serif !important;
            color: #0F172A;
        }
        
        nav {
            background: #FFFFFF;
            border-bottom: 1px solid #E4EAF0;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
        }
        
        nav .logo {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            color: #0F172A;
        }
        
        nav .logo .teal { color: #0F766E; }
        
        nav .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        
        nav a {
            text-decoration: none;
            color: #0F766E;
            font-weight: 600;
            font-size: 14px;
        }
        
        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 80px 24px;
            text-align: center;
        }
        
        h1 {
            font-family: 'DM Sans', sans-serif;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 24px;
            color: #0F172A;
            letter-spacing: -0.02em;
        }
        
        .welcome {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: #0F172A;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .children-list {
            background: #FFFFFF;
            border: 1px solid #E4EAF0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
            text-align: left;
        }
        
        .children-list h2 {
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #0F172A;
        }
        
        .children-list ul {
            list-style: none;
            padding: 0;
        }
        
        .children-list li {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 8px 0;
            color: #475569;
            border-bottom: 1px solid #E4EAF0;
        }
        
        .children-list li:last-child {
            border-bottom: none;
        }
        
        .next-steps {
            background: #FFFFFF;
            border: 1px solid #E4EAF0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 32px;
            text-align: left;
        }
        
        .next-steps h2 {
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #0F172A;
        }
        
        .next-steps ol {
            padding-left: 20px;
        }
        
        .next-steps li {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin-bottom: 12px;
            color: #475569;
            line-height: 1.6;
        }
        
        .btn-primary {
            background: #0F766E;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            height: 44px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: background 0.2s;
        }
        
        .btn-primary:hover { background: #0D5F58; }
        
        footer {
            background: #FFFFFF;
            border-top: 1px solid #E4EAF0;
            padding: 32px 24px;
            text-align: center;
            color: #64748B;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="../index.html" class="logo">FIRST PULL <span class="teal">CARDS</span></a>
        <div class="nav-links">
            <a href="explore/index.html">Card Explorer</a>
            <a href="open/collection.html">My Collection</a>
            <a href="../login.html">Log In</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>Registration Complete</h1>
        
        <div class="welcome" id="welcomeText"></div>
        
        <div class="children-list" id="childrenContainer"></div>
        
        <div class="next-steps">
            <h2>Next Steps</h2>
            <ol>
                <li>Watch the intro video to learn how it works</li>
                <li>Log in to your dashboard</li>
            </ol>
        </div>
        
        <button class="btn-primary" onclick="window.location.href = 'dashboard/index.html'">Go to Dashboard</button>
    </div>
    
    <footer>
        2026 First Pull Cards. Pilot program.
    </footer>
    
    <script>
        const family = JSON.parse(sessionStorage.getItem('fpc_family') || '{}');
        
        if (family.parentName) {
            document.getElementById('welcomeText').textContent = `Welcome, ${family.parentName}!`;
            
            const childrenDiv = document.getElementById('childrenContainer');
            childrenDiv.innerHTML = `
                <h2>Your Children</h2>
                <ul>
                    ${family.children.map(child => `<li>${child}</li>`).join('')}
                </ul>
            `;
        } else {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
